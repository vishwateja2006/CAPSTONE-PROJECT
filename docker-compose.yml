version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: disaster_db
    restart: always
    environment:
      POSTGRES_USER: disaster_admin
      POSTGRES_PASSWORD: disaster_secure_password
      POSTGRES_DB: disaster_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disaster_admin -d disaster_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: disaster_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disaster_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://disaster_admin:disaster_secure_password@db:5432/disaster_management
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super_secret_jwt_key_disaster_relief_capstone_2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disaster_frontend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:

